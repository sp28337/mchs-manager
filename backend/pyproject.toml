[project]
name = "fps-timekeeping-backend"
version = "0.1.0"
description = "FPS Service Time Accounting System — backend (FastAPI + SQLAlchemy 2 + Celery)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "redis>=5.2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "black>=24.10.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx2>=2.9.1",
    "schemathesis>=3.39.0",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

# У Celery нет ни встроенных аннотаций, ни пакета стабов в typeshed.
# Без этой оговорки `strict` считает каждый `@celery.task` нетипизированным
# декоратором и объявляет нетипизированной саму задачу — то есть шумит на
# том, что проверить всё равно не может. Ослабление ТОЧЕЧНОЕ: касается
# только импорта celery, остальной код продолжает проверяться строго.
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
