services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fps
      POSTGRES_PASSWORD: fps
      POSTGRES_DB: fps_timekeeping
    ports:
      - "5432:5432"
    volumes:
      - fps_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fps -d fps_timekeeping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  fps_postgres_data:
