[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

; sqlalchemy.url is intentionally left blank here — env.py overrides it at
; runtime from composition/settings.py (Settings.database_dsn), so the DSN
; is configured in exactly one place (Backend_Architecture раздел 6.3:
; "валидируются при старте процесса, а не в рантайме где-то посередине").
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
