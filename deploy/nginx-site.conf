# Кладётся в /etc/nginx/sites-available/grafik13.ru и линкуется в
# sites-enabled. Требует подключённых `deploy/nginx-metrics.conf` (в блок
# `http`) и `deploy/nginx-security-headers.conf` (в snippets).
#
# Три вещи здесь сделаны не так, как напрашивается, и каждая — из-за
# поведения nginx, которое проявляется молча. Все три проверены на
# nginx 1.24, а не выведены из документации:
#
#   1. `try_files` заканчивается на `=404`, а не на `/404.html`.
#      Последний аргумент-URI делает внутренний редирект и отдаёт страницу
#      ошибки С КОДОМ 200. Для сайта, живущего с поиска, это худший из
#      возможных вариантов: несуществующие адреса выглядят для поисковика
#      рабочими страницами. Настоящий 404 даёт связка `=404` + `error_page`.
#
#   2. Защитные заголовки подключаются В КАЖДЫЙ location.
#      `add_header` не наследуется вниз, если на нижнем уровне есть свой.
#      Одна строка про кеширование в location — и оттуда пропадают CSP и
#      HSTS.
#
#   3. `location /` вместо `location ~* \.html$` для правила «HTML не
#      кешировать». Регулярное location срабатывает только на прямой
#      запрос `/calculator.html`, а люди ходят на `/calculator`: внутренний
#      редирект из `try_files` на уровне `server` до него не доходит.
#      Правило было, а не работало.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name grafik13.ru;

    root /var/www/grafik13/current;
    index index.html;

    server_tokens off;

    # --- Логи ------------------------------------------------------------
    # По умолчанию не пишем ничего: стандартный формат содержит IP.
    # Считаются только страницы, форматом `metrics` — см. nginx-metrics.conf.
    access_log off;
    # Ошибки формату не поддаются и содержат IP всегда. `crit` оставляет
    # настоящие аварии и убирает поток записей на каждый 404.
    error_log /var/log/nginx/error.log crit;

    error_page 404 /404.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css text/plain application/javascript application/json
               application/xml image/svg+xml;

    # --- Страницы --------------------------------------------------------
    location / {
        include snippets/security-headers.conf;
        # HTML кешировать нельзя: иначе после выкладки человек ещё неделю
        # видит прежний расчёт.
        add_header Cache-Control "no-cache" always;

        access_log /var/log/nginx/metrics.log metrics;

        # Экспорт кладёт страницы как `calculator.html`. Без `$uri.html`
        # адрес `/calculator` вернёт 404, хотя файл на месте.
        try_files $uri $uri.html $uri/index.html =404;
    }

    # --- Статика сборки --------------------------------------------------
    # Имена содержат хеш и никогда не меняются под тем же адресом —
    # кешируется навсегда. В посещаемость не идёт: сорок запросов к статике
    # ничего о ней не говорят.
    #
    # `^~` обязателен. Без него `.svg` внутри `_next/static/` перехватило бы
    # регулярное location ниже и выдало бы `no-cache` вместо `immutable`.
    location ^~ /_next/static/ {
        include snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # --- Файлы, которые браузер и роботы запрашивают сами -----------------
    # Иконка, robots.txt, sitemap.xml — не просмотры страниц. Если их
    # считать, счётчик главной удвоится за счёт favicon.
    location ~* \.(svg|ico|png|webmanifest|txt|xml)$ {
        include snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        access_log off;
    }

    # --- Страница ошибки --------------------------------------------------
    # `internal` — чтобы на неё нельзя было зайти напрямую и получить 200.
    # Логируется намеренно: так в статистике видно битые ссылки, причём под
    # исходным адресом, а не под `/404.html`.
    location = /404.html {
        include snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        access_log /var/log/nginx/metrics.log metrics;
        internal;
    }

    ssl_certificate     /etc/letsencrypt/live/grafik13.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/grafik13.ru/privkey.pem;   # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;                        # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;                          # managed by Certbot
}

# Перенаправление с http. Если такой блок уже создал Certbot — второй не
# нужен: nginx выдаст предупреждение о конфликте имён и проигнорирует его.
server {
    listen 80;
    listen [::]:80;
    server_name grafik13.ru;

    access_log off;
    return 301 https://$host$request_uri;
}
