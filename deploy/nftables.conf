#!/usr/sbin/nft -f
#
# Межсетевой экран сервера. Кладётся в /etc/nftables.conf и применяется
# `systemctl enable --now nftables`.
#
# --- Главное: здесь НЕТ `flush ruleset` -------------------------------------
#
# Почти во всех примерах в сети файл начинается с `flush ruleset`. На машине
# с docker это выстрел в ногу: docker держит свои правила (проброс портов,
# маскарад, цепочки DOCKER*) в том же движке nftables через iptables-nft, и
# общий сброс сносит их тоже. Снаружи это выглядит так: правила применились,
# всё «работает», а проброшенные порты контейнеров молча перестают
# отвечать — до перезапуска демона docker.
#
# Поэтому своё хозяйство живёт в отдельной таблице `inet grafik`, и
# перечитывание файла сбрасывает только её (`delete table` ниже). Чужие
# таблицы — docker, fail2ban — не трогаются.
#
# --- Чего здесь тоже нет ----------------------------------------------------
#
# **Цепочки `forward`.** Пересылкой пакетов между контейнерами и наружу
# занимается docker, и своя цепочка `forward` с политикой `drop` сломала бы
# ему сеть. Контейнеры при этом не выставлены наружу: порт API
# публикуется на петле хозяина (`deploy/compose.prod.yml`), у базы порта
# нет вовсе.
#
# **Правила для IPv6 наружу.** Сайт работает по обоим протоколам, и
# таблица `inet` покрывает оба сразу — отдельных правил не нужно. А вот
# ICMPv6 пропускать ОБЯЗАТЕЛЬНО (см. ниже): без него IPv6 не работает
# вовсе, и это самая частая ошибка в таких файлах.

table inet grafik
delete table inet grafik

table inet grafik {
    chain input {
        type filter hook input priority filter; policy drop;

        # Петля — своя. Без этого правила ломается всё, что общается само с
        # собой: nginx с API, postgres с собой, systemd-resolved.
        iif lo accept

        # Уже установленные соединения и то, что к ним относится. Это
        # правило первым по счёту не случайно: через него проходит
        # большинство пакетов, и чем раньше оно сработает, тем меньше
        # работы на пакет.
        ct state established,related accept

        # Мусор отбрасываем раньше остального, чтобы он не попадал в счёт
        # «новых соединений» ниже.
        ct state invalid drop

        # --- ICMP ------------------------------------------------------
        #
        # Эхо (пинг) с ограничением частоты: полезно для проверки связи,
        # но не должно быть ещё одним способом нагрузить машину.
        icmp type echo-request limit rate 5/second accept

        # ICMPv6 — не вежливость, а условие работы IPv6: обнаружение
        # соседей (ND) и сообщения о слишком большом пакете (PTB) ходят
        # именно им. Заблокируешь — получишь сеть, которая «иногда
        # работает» и очень плохо отлаживается.
        icmpv6 type {
            echo-request,
            echo-reply,
            destination-unreachable,
            packet-too-big,
            time-exceeded,
            parameter-problem,
            nd-neighbor-solicit,
            nd-neighbor-advert,
            nd-router-advert,
            nd-router-solicit
        } accept

        # --- Что открыто наружу ----------------------------------------
        #
        # Три порта, и больше ничего. API среди них нет: он слушает только
        # петлю, и снаружи к нему ходят через nginx.
        tcp dport 22 accept comment "ssh — перебор ловит fail2ban"
        tcp dport 80 accept comment "http — только перенаправление на https"
        tcp dport 443 accept comment "сайт и /api/"

        # --- Что открыто изнутри ---------------------------------------
        #
        # Приложению в контейнере нужен свой SMTP на хозяине машины (своим
        # его держим, чтобы не заводить второго обработчика персональных
        # данных). Контейнер приходит со своей подсети — ей и открыто,
        # остальному миру 25-й порт закрыт.
        #
        # Подсеть та же, что в `deploy/compose.prod.yml`; меняется в двух
        # местах сразу.
        ip saddr 172.28.0.0/24 tcp dport 25 accept comment "почта из контейнера"

        # Остальное падает по политике цепочки. Счётчик нужен, чтобы на
        # вопрос «а не рубит ли экран что-то нужное» отвечала команда
        # `nft list table inet grafik`, а не догадки.
        counter comment "отброшено политикой"
    }
}
