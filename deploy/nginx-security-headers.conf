# Кладётся в /etc/nginx/snippets/security-headers.conf и подключается
# `include` В КАЖДЫЙ `location`, где есть свой `add_header`.
#
# --- Почему отдельным файлом, а не один раз в `server` -------------------
#
# `add_header` не складывается по уровням: если на текущем уровне есть
# хоть один `add_header`, ВСЕ унаследованные отбрасываются. Флаг `always`
# на это не влияет.
#
# То есть достаточно написать в `location` одну строку про кеширование —
# и оттуда молча пропадают Content-Security-Policy, HSTS и всё остальное.
# Проверено на nginx 1.24: при заголовках, объявленных один раз выше по
# дереву, `_next/static/*` и страница ошибки уходили клиенту вообще без
# защитных заголовков.
#
# Отсюда правило: добавили `add_header` в location — добавьте туда же и
# этот `include`.

add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; base-uri 'self'" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
