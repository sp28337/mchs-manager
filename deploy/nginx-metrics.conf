# Подключается в блок `http` (например, /etc/nginx/conf.d/metrics.conf).
# Сам сбор включается в `server` — см. deploy/nginx-site.conf.
#
# В логе нет ни IP, ни User-Agent, ни кук, ни идентификатора посетителя.
# Анонимизировать тут нечего, потому что персональные данные в него просто
# не попадают. Зачем именно так — DEPLOYMENT.md, «Статистика посещаемости».

# Из реферера оставляем только домен. Полный адрес чужой страницы может
# содержать в параметрах что угодно, домен — не может.
map $http_referer $ref_host {
    ""                       "-";
    ~^https?://(?<h>[^/?]+)  $h;
    default                  "-";
}

# Вместо строки User-Agent — класс устройства. Полный UA это слабый, но
# отпечаток; «mobile» отпечатком быть не может, а доля мобильных из него
# видна ровно так же.
map $http_user_agent $ua_class {
    ~*(bot|crawl|spider|slurp|yandex|google)  bot;
    ~*(ipad|tablet)                           tablet;
    ~*(iphone|android|mobile)                 mobile;
    default                                   desktop;
}

# Путь, который человек запросил, а не тот, которым он кончил.
#
# `$uri` к моменту записи в лог уже переписан: `/calculator` превращается
# в `/calculator.html`, а несуществующий адрес — в `/404.html`, и в
# статистике вместо битой ссылки оказался бы список обращений к странице
# ошибки. `$request_uri` не переписывается никогда; отрезаем от него
# параметры запроса и получаем исходный путь.
map $request_uri $req_path {
    ~^(?<p>[^?]*)  $p;
    default        $request_uri;
}

log_format metrics '$time_iso8601\t$request_method\t$req_path\t$status\t$ref_host\t$ua_class';
