# Настройки pnpm 11.
#
# `allowBuilds` — какие пакеты вправе выполнять свои скрипты установки.
# `unrs-resolver` — нативный резолвер путей внутри eslint-import-resolver,
# ему сборка нужна; по умолчанию pnpm 11 такие скрипты запрещает, и это
# правильный по умолчанию запрет.
allowBuilds:
  unrs-resolver: true

# pnpm 11 отвергает пакеты, опубликованные меньше суток назад: свежая
# версия — самый частый способ доставки скомпрометированного пакета.
# Исключение сделано точечно и с версией, а не для пакета целиком.
minimumReleaseAgeExclude:
  - '@types/node@26.2.0'
