<style>
#erd svg.erDiagram .divider path { stroke-opacity: 0.5; }
#erd svg.erDiagram .row-rect-odd path,
#erd svg.erDiagram .row-rect-odd rect,
#erd svg.erDiagram .row-rect-even path,
#erd svg.erDiagram .row-rect-even rect { stroke: none !important; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const { svg } = await mermaid.render('erd-svg', `erDiagram
  RULE ||--o{ RULE_VERSION : versions
  UNIT ||--o{ EMPLOYEE : employs
  POSITION ||--o{ EMPLOYEE : classifies
  EMPLOYEE ||--o{ PLANNED_SHIFT : assigned
  DUTY_SCHEDULE ||--o{ PLANNED_SHIFT : contains
  EMPLOYEE ||--o{ TIMESHEET : has
  TIMESHEET ||--o{ SERVICE_TIME_EVENT : records
  OVERTIME_ORDER ||--o{ SERVICE_TIME_EVENT : justifies
  TIMESHEET ||--|| HOURS_BREAKDOWN_PROJECTION : projects
  TIMESHEET ||--|| COMPENSATION_CASE : justifies
  COMPENSATION_CASE ||--o{ COMPENSATION_LINE : contains
  COMPENSATION_LINE ||--o{ BALANCE_MOVEMENT : accrues
  EMPLOYEE ||--o{ LEAVE_GRANT : grants
  LEAVE_GRANT ||--o{ RECALL_EVENT : recalls
  LEAVE_GRANT ||--o{ BALANCE_MOVEMENT : consumes

  RULE {
    uuid id PK
    text code
  }
  RULE_VERSION {
    uuid id PK
    uuid rule_id FK
    date valid_from
    date valid_to
  }
  UNIT {
    uuid id PK
    ltree hierarchy_path
  }
  POSITION {
    uuid id PK
    text category
  }
  EMPLOYEE {
    uuid id PK
    text personnel_number
    text status
  }
  DUTY_SCHEDULE {
    uuid id PK
    uuid unit_id
  }
  PLANNED_SHIFT {
    uuid id PK
    tstzrange time_range
  }
  TIMESHEET {
    uuid id PK
    uuid employee_id
    text status
  }
  SERVICE_TIME_EVENT {
    uuid id PK
    text event_type
  }
  OVERTIME_ORDER {
    uuid id PK
    text order_number
  }
  HOURS_BREAKDOWN_PROJECTION {
    uuid timesheet_id PK
    numeric overtime_hours
  }
  COMPENSATION_CASE {
    uuid id PK
    text status
  }
  COMPENSATION_LINE {
    uuid id PK
    numeric hours_amount
  }
  BALANCE_MOVEMENT {
    uuid id PK
    text movement_type
  }
  LEAVE_GRANT {
    uuid id PK
    text leave_type
  }
  RECALL_EVENT {
    uuid id PK
    date recall_date
  }
`);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
