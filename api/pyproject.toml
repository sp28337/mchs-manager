# Бэкенд «График 1 3»: зависимости и настройки инструментов в одном файле.
#
# Версии проверены 11.10.2026 по PyPI. Нижняя граница — то, на чём писалось;
# верхняя закрывает минорную ветку у библиотек, которые ломают API в минорах
# (FastAPI и uvicorn до 1.0 — именно такие). Точные версии всё равно держит
# uv.lock, и он в коммите: это приложение, а не библиотека.

[project]
name = "grafik-api"
version = "0.1.0"
description = "Сервер синхронизации «График 1 3»"
readme = "README.md"
# Образ и CI работают на 3.14. Здесь 3.13, и это не небрежность: в
# контейнере разработки закрыт доступ к github.com, откуда uv тянет
# управляемые интерпретаторы, и на 3.14 там не собрать окружение вовсе.
# Синтаксиса, которого нет в 3.13, в коде нет — проверяет ruff
# (target-version = py313).
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143,<0.144",
    "pydantic-settings>=2.15,<3",
    # [standard] — uvloop, httptools и watchfiles: первые два нужны
    # боевому серверу, третий — перезагрузке при разработке.
    "uvicorn[standard]>=0.54,<0.55",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=7.1,<8",
    "httpx>=0.28,<0.29",
    "ruff>=0.17,<0.18",
    "black>=26.10,<27",
    "mypy>=2.4,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grafik_api"]

# --- Инструменты ------------------------------------------------------------

# Форматирует black, линтует ruff. Оба настроены на одну длину строки, и
# `ruff format` не используется: два форматировщика на один файл — это спор
# о пробелах в каждом коммите.
[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle
    "W",
    "F",      # pyflakes
    "I",      # сортировка импортов
    "N",      # имена
    "UP",     # устаревшие конструкции
    "B",      # ловушки bugbear
    "A",      # затенение встроенных имён
    "C4",     # comprehension'ы
    "SIM",    # упрощения
    "ASYNC",  # ошибки в асинхронном коде
    "S",      # bandit: небезопасные вызовы
    "RUF",
]
ignore = [
    # Правила про «похожие на латиницу» символы: ловят подмену букв в
    # коде на кириллические омоглифы. В проекте, где все комментарии и
    # докстринги по-русски, они срабатывают на каждом слове и не ловят
    # ничего — предупреждение на букву «о» в слове «обработка» не несёт
    # смысла. Идентификаторы при этом всё равно проверяются компилятором:
    # кириллическая `с` в `self` даст NameError на первом же запуске.
    "RUF001",  # в коде
    "RUF002",  # в докстрингах
    "RUF003",  # в комментариях
]

[tool.ruff.lint.per-file-ignores]
# assert — язык pytest, а не недосмотр.
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
# Сообщение без кода правила нечем ни подавить, ни найти в документации.
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# auto: каждый async-тест и так асинхронный, помечать их вручную — шум.
asyncio_mode = "auto"
# Без явной области видимости pytest-asyncio 1.x предупреждает на каждом
# запуске; цикл на тест — то, что нужно изолированным тестам.
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers --strict-config"

[tool.coverage.run]
source = ["src/grafik_api"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:"]
