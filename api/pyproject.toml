# Бэкенд «График 1 3»: зависимости и настройки инструментов в одном файле.
#
# Версии проверены 11.10.2026 по PyPI. Нижняя граница — то, на чём писалось;
# верхняя закрывает минорную ветку у библиотек, которые ломают API в минорах
# (FastAPI и uvicorn до 1.0 — именно такие). Точные версии всё равно держит
# uv.lock, и он в коммите: это приложение, а не библиотека.

[project]
name = "grafik-api"
version = "0.1.0"
description = "Сервер синхронизации «График 1 3»"
readme = "README.md"
# Образ и CI работают на 3.14. Здесь 3.13, и это не небрежность: в
# контейнере разработки закрыт доступ к github.com, откуда uv тянет
# управляемые интерпретаторы, и на 3.14 там не собрать окружение вовсе.
# Синтаксиса, которого нет в 3.13, в коде нет — проверяет ruff
# (target-version = py313).
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20,<2",
    # argon2id: и для хэша проверочного значения на сервере, и как
    # эталон параметров, которые считает браузер.
    "argon2-cffi>=25.1,<26",
    "fastapi>=0.143,<0.144",
    # [binary] — готовое libpq в колесе: иначе образу нужен libpq-dev и
    # компилятор, а это лишние сто мегабайт и лишняя сборка.
    "psycopg[binary]>=3.3.6,<4",
    # [email] — проверка адреса (email-validator). Нормализуем мы сами,
    # но отличить адрес от строки должен кто-то знающий RFC.
    "pydantic[email]>=2.14,<3",
    "pydantic-settings>=2.15,<3",
    "pyjwt>=2.15,<3",
    "sqlalchemy[asyncio]>=2.1.4,<3",
    # [standard] — uvloop, httptools и watchfiles: первые два нужны
    # боевому серверу, третий — перезагрузке при разработке.
    "uvicorn[standard]>=0.54,<0.55",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=7.1,<8",
    "httpx>=0.28,<0.29",
    "ruff>=0.17,<0.18",
    "black>=26.10,<27",
    "mypy>=2.4,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grafik_api"]

# --- Инструменты ------------------------------------------------------------

# Форматирует black, линтует ruff. Оба настроены на одну длину строки, и
# `ruff format` не используется: два форматировщика на один файл — это спор
# о пробелах в каждом коммите.
[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle
    "W",
    "F",      # pyflakes
    "I",      # сортировка импортов
    "N",      # имена
    "UP",     # устаревшие конструкции
    "B",      # ловушки bugbear
    "A",      # затенение встроенных имён
    "C4",     # comprehension'ы
    "SIM",    # упрощения
    "ASYNC",  # ошибки в асинхронном коде
    "S",      # bandit: небезопасные вызовы
    "RUF",
]
ignore = [
    # Правила про «похожие на латиницу» символы: ловят подмену букв в
    # коде на кириллические омоглифы. В проекте, где все комментарии и
    # докстринги по-русски, они срабатывают на каждом слове и не ловят
    # ничего — предупреждение на букву «о» в слове «обработка» не несёт
    # смысла. Идентификаторы при этом всё равно проверяются компилятором:
    # кириллическая `с` в `self` даст NameError на первом же запуске.
    "RUF001",  # в коде
    "RUF002",  # в докстрингах
    "RUF003",  # в комментариях
]

[tool.ruff.lint.per-file-ignores]
# assert — язык pytest, а не недосмотр. Заведомо поддельные секреты в
# тестах — тоже: без них нечем проверить, что чужая подпись не проходит.
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
# Миграции тоже проверяются: сгенерированный файл — обычный код, и
# опечатка в нём обнаруживается либо здесь, либо на боевой базе.
files = ["src", "tests", "migrations"]
# Сообщение без кода правила нечем ни подавить, ни найти в документации.
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# auto: каждый async-тест и так асинхронный, помечать их вручную — шум.
asyncio_mode = "auto"
# Без явной области видимости pytest-asyncio 1.x предупреждает на каждом
# запуске; цикл на тест — то, что нужно изолированным тестам.
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers --strict-config"

[tool.coverage.run]
source = ["src/grafik_api"]
branch = true
# SQLAlchemy в асинхронном режиме переключает greenlet'ы, и без этой
# строки покрытие теряет всё, что выполняется ПОСЛЕ первого обращения к
# базе: строки есть, тесты их проходят, а отчёт показывает 59%. Полдня
# на такую загадку — обычная плата за необъяснённую настройку, поэтому
# она объяснена.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
# Порога здесь нет намеренно: без тестовой базы половина тестов
# пропускается, и любой порог превратился бы в ложную тревогу у того, кто
# гоняет проверки без поднятого окружения. Порог стоит в CI
# (`--cov-fail-under=85`), где база есть всегда.
exclude_also = ["if TYPE_CHECKING:"]


[tool.alembic]

# Своего alembic.ini у проекта нет: всё, что в нём оставалось, — адрес базы
# (он приходит из GRAFIK_DATABASE_URL, см. migrations/env.py) и настройка
# логов (она у нас своя, JSON). Два места, задающих одно и то же, однажды
# разойдутся.
script_location = "%(here)s/migrations"

# `src` в пути — чтобы миграции запускались и в неустановленном дереве.
prepend_sys_path = ["src", "."]

# Дата в имени файла: в каталоге сразу видно порядок, а не только связь
# по `down_revision`.
file_template = "%%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s"

# Сгенерированный файл проходит те же проверки, что и остальной код, —
# иначе первая же автогенерация роняет линтер.
[[tool.alembic.post_write_hooks]]
name = "black"
type = "console_scripts"
entrypoint = "black"
options = "REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff"
type = "module"
module = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"
