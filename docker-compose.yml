# Окружение разработки: база, API и почтовая ловушка.
#
# Боевой состав — отдельным файлом (deploy/compose.prod.yml, шаг 13): у него
# другие образы, другие порты, другие секреты и нет ни перезагрузки, ни
# монтирования исходников. Смешивать их в одном файле с профилями значит
# однажды поднять в бою разработческий пароль.
#
# Ключа `version` здесь нет: Compose считает его устаревшим и ругается.

name: grafik13

services:
  postgres:
    image: postgres:18.6-trixie
    environment:
      # Пароль заведомо разработческий и лежит в git осознанно: эта база
      # живёт в контейнере на машине разработчика и наружу не смотрит.
      # Боевые значения приходят из окружения сервера (шаг 13).
      POSTGRES_USER: grafik
      POSTGRES_PASSWORD: grafik
      POSTGRES_DB: grafik
      # Инициализация с явной локалью: сортировка по умолчанию зависит от
      # локали образа, а на ней стоят индексы — пусть будет одинаковой у
      # всех.
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
    ports:
      # Только на петлю: порт базы, открытый в локальную сеть, — это
      # приглашение всем, кто в той же кофейне.
      - "127.0.0.1:5432:5432"
    volumes:
      # Том монтируется в /var/lib/postgresql, а НЕ в .../data.
      # -----------------------------------------------------------------
      # С версии 18 официальный образ держит данные в каталоге с номером
      # выпуска (`PGDATA=/var/lib/postgresql/18/docker`) и объявляет том на
      # уровень выше — так же, как это делает сам PostgreSQL с
      # `pg_ctlcluster`, и так `pg_upgrade --link` не упирается в границу
      # монтирования.
      #
      # Прежний путь не просто бесполезен: точка монтирования в
      # `/var/lib/postgresql/data` роняет контейнер при старте. Образ
      # считает её забытым томом от старой версии и отказывается работать
      # («there appears to be PostgreSQL data in … (unused mount/volume)»)
      # — даже если том пустой.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grafik -d grafik"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./api
      target: dev
    environment:
      GRAFIK_ENV: dev
      GRAFIK_LOG_LEVEL: DEBUG
      GRAFIK_DATABASE_URL: postgresql+psycopg://grafik:grafik@postgres:5432/grafik
      # Письма уходят в ловушку рядом (http://127.0.0.1:8025), а ссылки в
      # них ведут на фронт, поднятый `pnpm dev`, — иначе по ссылке из
      # письма при разработке некуда перейти.
      GRAFIK_SMTP_HOST: mailpit
      GRAFIK_SMTP_PORT: 1025
      # Именно `localhost`, а не `127.0.0.1`, хотя это один и тот же
      # компьютер. Для браузера это РАЗНЫЕ узлы, и от выбора зависят две
      # вещи сразу: cookie сессии с `SameSite=Strict` не уходит на другое
      # имя узла, а CORS при разработке разрешён ровно для
      # `http://localhost:3000` (`main.py`, `_разрешить_разработку`).
      # Со ссылкой на `127.0.0.1` страница подтверждения адреса
      # открывалась бы, но запрос к API отвергался бы браузером.
      GRAFIK_PUBLIC_URL: http://localhost:3000
    volumes:
      # Монтируется только src, а не весь ./api: виртуальное окружение
      # живёт в /app/.venv внутри образа, и монтирование каталога целиком
      # перекрыло бы его — приложение не нашло бы собственных зависимостей.
      - ./api/src:/app/src
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # curl в slim-образе нет, и ставить его только ради проверки незачем:
      # интерпретатор уже на месте.
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/v1/healthz")
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  mailpit:
    # Ловушка для писем: всё, что приложение отправит, останется здесь и
    # покажется на http://127.0.0.1:8025. Нужна подтверждению адреса и
    # восстановлению доступа — наружу при разработке не уходит ни одного
    # письма, даже если в адресе окажется живой ящик.
    image: axllent/mailpit:v1.31.5
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  pgdata:
