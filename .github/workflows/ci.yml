name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend-lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fps
          POSTGRES_PASSWORD: fps
          POSTGRES_DB: fps_timekeeping
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fps -d fps_timekeeping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      FPS_DATABASE_DSN: postgresql+asyncpg://fps:fps@localhost:5432/fps_timekeeping
      FPS_JWT_PUBLIC_KEY: ci-dummy-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Mypy
        run: mypy src

      - name: Import boundaries (Architecture разд. 4.2, 7)
        run: lint-imports

      - name: Apply migrations (verifies DDL against real Postgres)
        run: alembic upgrade head

      - name: Unit tests (no DB/Redis required)
        run: pytest tests/unit -v

      - name: Integration tests (real Postgres — RE015 etc.)
        run: pytest tests/integration -v