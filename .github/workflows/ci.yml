name: CI

on:
  # Запуск руками — на случай, когда событие до Actions не дошло: так было
  # с выпуском 2.8.0, где не появилось ни проверки на pull request, ни
  # сборки на пуш в `main`. Без этого единственным способом собрать и
  # выложить уже слитое остаётся пустой коммит.
  workflow_dispatch:
  pull_request:
    branches: 
      - main
      - staging
  push:
    branches: 
      - main
  #     - staging
  workflow_call:
    inputs:
      site-url:
        description: https://grafik13.ru
        required: true
        type: string
    outputs:
      artifact:
        description: Artefact name.
        value: site

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true


jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Types
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

      - name: Build
        env:
          # Адрес нужен на сборке: из него собираются canonical, Open Graph
          # и sitemap. Когда workflow вызывают из CD, он приходит входным
          # параметром; на pull request параметра нет, и берётся боевой
          # адрес — артефакт такой сборки в прод всё равно не попадает.
          NEXT_PUBLIC_SITE_URL: ${{ inputs.site-url || 'https://grafik13.ru' }}
        run: pnpm build

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: out/
          retention-days: 7
          if-no-files-found: error
