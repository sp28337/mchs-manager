name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend-lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Mypy
        run: mypy src

      - name: Import boundaries (Architecture разд. 4.2, 7)
        run: lint-imports

      - name: Unit tests (no DB/Redis required)
        run: pytest tests/unit -v
