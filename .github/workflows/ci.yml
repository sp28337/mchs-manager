name: CI

# Раньше здесь поднимались Postgres и Redis ради бэкенда. Приложение
# статическое: расчёт и хранение живут в браузере, сервера нет — и
# проверять, соответственно, нечего, кроме самого фронтенда.

on:
  pull_request:
  push:
    branches: [main, staging]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Types
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Расчёт нормы: нормы приказов 307/308, график караула, разбор дат
      # и производственный календарь. Числа сверены с прежним расчётом на
      # Python до последней цифры — здесь они и охраняются.
      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build
