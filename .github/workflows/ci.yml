name: CI

on:
  # Запуск руками — на случай, когда событие до Actions не дошло: так было
  # с выпуском 2.8.0, где не появилось ни проверки на pull request, ни
  # сборки на пуш в `main`. Без этого единственным способом собрать и
  # выложить уже слитое остаётся пустой коммит.
  workflow_dispatch:
  pull_request:
    branches: 
      - main
      - staging
  push:
    branches: 
      - main
  #     - staging
  workflow_call:
    inputs:
      site-url:
        description: https://grafik13.ru
        required: true
        type: string
    outputs:
      artifact:
        description: Artefact name.
        value: site

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true


jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Документы проверяются до сборки: страницы политики, согласия и
      # условий собираются из `docs/legal/*.md`, а манифест версий и
      # хэшей, которым сервер отвечает на `GET /legal/documents`, —
      # оттуда же. Устаревший манифест означал бы, что запись о согласии
      # ссылается на редакцию, которой нет.
      - name: Legal documents
        run: node scripts/legal.mjs

      - name: Types
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

      - name: Build
        env:
          # Адрес нужен на сборке: из него собираются canonical, Open Graph
          # и sitemap. Когда workflow вызывают из CD, он приходит входным
          # параметром; на pull request параметра нет, и берётся боевой
          # адрес — артефакт такой сборки в прод всё равно не попадает.
          NEXT_PUBLIC_SITE_URL: ${{ inputs.site-url || 'https://grafik13.ru' }}
          # Рубильник синхронизации. Переменная репозитория, а не строка в
          # коде: включать её можно только вместе с поднятым сервером и
          # опубликованными документами (UPGRADE.md), и решение это
          # административное, а не правка исходников. Пусто — синхронизации
          # в сборке нет вовсе: ни экрана входа, ни единого обращения к
          # серверу.
          NEXT_PUBLIC_SYNC_ENABLED: ${{ vars.SYNC_ENABLED }}
          # Адрес API. По умолчанию `/api/v1` на своём же домене — то, что
          # отдаёт nginx; переменная нужна, только если API встанет на
          # другой домен.
          NEXT_PUBLIC_API_URL: ${{ vars.API_URL }}
        run: pnpm build

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: out/
          retention-days: 7
          if-no-files-found: error
