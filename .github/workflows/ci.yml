name: CI

on:
  pull_request:
    branches: 
      - main
      - staging
  push:
    branches: 
      - main
  #     - staging
  workflow_call:
    inputs:
      site-url:
        description: https://pererabotal.ru
        required: true
        type: string
    outputs:
      artifact:
        description: Имя артефакта с готовой статикой.
        value: site

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true


jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Types
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

      - name: Build
        env:
          # На pull request адреса нет — собираем с заглушкой только чтобы
          # убедиться, что сборка проходит. Артефакт такой сборки в прод не
          # попадёт: CD вызывает этот же workflow со своим `site-url`.
          NEXT_PUBLIC_SITE_URL: ${{ inputs.site-url || 'https://example.invalid' }}
        run: pnpm build

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: out/
          retention-days: 7
          if-no-files-found: error
