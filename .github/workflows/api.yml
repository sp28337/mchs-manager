name: API

on:
  # Как и у фронта: запуск руками на случай, когда событие до Actions не
  # дошло.
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - staging
    paths:
      - 'api/**'
      - 'docker-compose.yml'
      - 'deploy/**'
      - '.github/workflows/api.yml'
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - 'docker-compose.yml'
      # Боевой состав и скрипты обслуживания едут на сервер выкладкой
      # (api-cd.yml), значит их правка — повод и проверить, и выложить.
      - 'deploy/**'
      - '.github/workflows/api.yml'

# Отдельный workflow, а не вторая джоба в CI, намеренно: CD слушает
# завершение именно CI, и выкладка фронта начала бы ждать проверок
# бэкенда — при том что в статический экспорт бэкенд не попадает вовсе.

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Линтеры, типы, тесты
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: api

    # База настоящая, той же версии, что в бою: миграции на SQLite не
    # проверяются никак — половина типов и ограничений там другая.
    services:
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_USER: grafik
          POSTGRES_PASSWORD: grafik
          POSTGRES_DB: grafik
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grafik -d grafik"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      GRAFIK_ENV: test
      GRAFIK_DATABASE_URL: postgresql+psycopg://grafik:grafik@127.0.0.1:5432/grafik
      # По нему тесты узнают, что живая база есть, и включают проверки,
      # которые без неё пропускаются.
      GRAFIK_TEST_DATABASE_URL: postgresql+psycopg://grafik:grafik@127.0.0.1:5432/grafik

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # uv ставится из PyPI с точной версией, а не сторонним действием:
      # версия инструмента сборки должна меняться коммитом, а не чужим
      # выпуском действия.
      - name: Setup uv
        run: pipx install uv==0.13.0
        working-directory: .

      # Интерпретатор скачивает сам uv — отдельное действие для Python не
      # нужно. В образе и здесь версия одна и та же: 3.14.
      - name: Install dependencies
        run: uv sync --locked --python 3.14

      - name: Lint
        run: |
          uv run ruff check .
          uv run black --check .

      - name: Types
        run: uv run mypy

      # Миграции прогоняются вверх, вниз и снова вверх: миграция, которую
      # нельзя снять, на боевой базе означает «только вперёд».
      - name: Migrations up and down
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      # Расхождение моделей с базой — это забытая миграция. Дешевле узнать
      # здесь, чем на выкладке.
      - name: Schema drift
        run: uv run alembic check

      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=85

  image:
    name: Образ и живость
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Сборка образа — единственная настоящая проверка Dockerfile, и
      # делается она здесь: в контейнере разработки, где пишется код,
      # демона Docker нет.
      #
      # Тег — короткий хэш коммита, а не `ci`: этот же образ уезжает в бой
      # (см. api-cd.yml), и по тегу на сервере должно быть видно, что
      # именно там работает.
      # Состав проверяется разборщиком самого compose, а не только нашими
      # тестами: тесты смотрят на смысл (порт базы, журналы, права), а
      # здесь проверяется, что файл вообще принимается — с подстановками,
      # якорями и профилями.
      #
      # Файлы окружения создаются пустыми во временном каталоге: без них
      # `config` отказывается читать состав, а настоящие живут только на
      # сервере.
      - name: Validate production compose
        run: |
          set -euo pipefail
          WORK=$(mktemp -d)
          cp deploy/compose.prod.yml "$WORK/"
          : > "$WORK/api.env"
          : > "$WORK/postgres.env"
          GRAFIK_IMAGE_TAG=ci docker compose -f "$WORK/compose.prod.yml" config \
            > /dev/null
          GRAFIK_IMAGE_TAG=ci docker compose -f "$WORK/compose.prod.yml" \
            --profile tools config --services
          rm -rf "$WORK"

      - name: Build image
        run: |
          echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          docker build --tag "grafik-api:${GITHUB_SHA::7}" api

      - name: Health check in container
        run: |
          set -euo pipefail
          docker run --detach --name grafik-api-ci --publish 8000:8000 "grafik-api:$TAG"

          # Первый запрос может прийти раньше, чем поднимется uvicorn:
          # ждём до 30 секунд и только потом считаем это отказом.
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8000/api/v1/healthz > answer.json; then
              break
            fi
            sleep 1
          done

          cat answer.json
          grep -q '"status":"ok"' answer.json

      - name: Container logs
        # Журналы нужны именно тогда, когда шаг выше упал.
        if: always()
        run: docker logs grafik-api-ci || true

      # В бой уезжает ровно тот образ, который только что собрался и ответил
      # на /healthz, — а не собранный заново на сервере или здесь второй
      # раз. Пересборка из тех же исходников дала бы другой образ: базовый
      # образ и колёса с PyPI могли обновиться между сборками, и
      # проверенным оказался бы не тот, что поехал.
      #
      # Складывается образ файлом, а не отправляется в реестр: своего
      # реестра у нас нет, а ghcr.io на пути к российскому серверу — ещё
      # одна внешняя зависимость в момент выкладки.
      #
      # Только для push в main: на каждом PR это сто мегабайт впустую.
      - name: Pack image for deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          docker save "grafik-api:$TAG" | gzip -6 > api-image.tar.gz
          ls -lh api-image.tar.gz

      - name: Upload image artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: api-image
          path: api-image.tar.gz
          # Храним недолго: артефакт нужен только выкладке, которая
          # начинается через минуту после сборки.
          retention-days: 3
          compression-level: 0
