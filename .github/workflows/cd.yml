name: CD

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # build:
  #   uses: ./.github/workflows/ci.yml
  #   with:
  #     site-url: ${{ vars.SITE_URL }}

  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    # needs: build
    runs-on: ubuntu-24.04

    environment:
      name: production
      url: ${{ vars.SITE_URL }}

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v8
        with:
          name: site
          path: site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Key and server's firgenprint
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
          ROOT: ${{ vars.DEPLOY_ROOT }}
        run: |
          set -euo pipefail
          RELEASE="$ROOT/releases/$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"

          ssh -p "${{ vars.SSH_PORT || 22 }}" "$USER@$HOST" "mkdir -p '$RELEASE'"
          rsync -az --delete -e "ssh -p ${{ vars.SSH_PORT || 22 }}" \
            site/ "$USER@$HOST:$RELEASE/"

          ssh -p "${{ vars.SSH_PORT || 22 }}" "$USER@$HOST" bash -euo pipefail -s <<EOF
            ln -sfn '$RELEASE' '$ROOT/current.new'
            mv -Tf '$ROOT/current.new' '$ROOT/current'
            ls -1dt '$ROOT'/releases/*/ | tail -n +6 | xargs -r rm -rf
          EOF

      - name: Check result
        env:
          URL: ${{ vars.SITE_URL }}
        run: |
          set -euo pipefail

          echo "Проверяем: $URL"

          # Проверяется по заголовку страницы, а не по фразе из текста:
          # тексты правятся часто, и проверка, привязанная к абзацу,
          # однажды роняет выкладку рабочей сборки. Заголовок меняется
          # вместе с назначением страницы — тогда проверку и надо чинить.
          echo "→ Главная"
          curl -fsS "$URL/" | grep -q "<title>.*сутки через трое.*</title>"

          echo "→ Расчёт"
          curl -fsS "$URL/calculator" | grep -q "<title>Расчёт — График 1 3</title>"

          echo "→ Условия использования"
          curl -fsS "$URL/terms" | grep -q "<title>Условия использования — График 1 3</title>"

          echo "→ robots.txt"
          curl -fsS "$URL/robots.txt" | grep -q "^Sitemap: $URL/sitemap.xml$"

          echo "✓ Выложено: $URL"
